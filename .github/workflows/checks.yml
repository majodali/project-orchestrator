name: Checks

# The checks a pull request and main must pass (the rebuild plan,
# docs/plans/rebuild.md, milestone 1): the plugin's tests and
# `plan-state check` over orchestration/state.json. `plan-state` comes
# from the service repository's package, pinned by commit in
# package.json.
#
# The plugin's form checker left this workflow on 2026-11-11, on the
# owner's decision: it checks the old process (a stage list without
# `parked`, a `dispatched` journal event for every executing node, a
# Backlog entry per node), and the service, which is the only writer
# of the state file, legitimately writes states it rejects. main was
# red for a day for that reason. `plan-state check` is the one
# validity rule; the form checker stays runnable by hand over the
# frozen documents.

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Tests, state check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: State check
        run: npm run check
      - name: Lint and format
        run: npm run lint && npm run format
